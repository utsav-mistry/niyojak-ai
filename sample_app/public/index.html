<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIYOJAK — To-Do App</title>
  <meta name="description" content="Demo workload application for the NIYOJAK AI Kubernetes Scheduler project." />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Page-specific styles */
    .hero {
      text-align: center;
      padding: 3rem 0 2rem;
    }
    .hero__title { margin-bottom: 0.5rem; }
    .hero__sub {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }
    .todo-form {
      display: flex;
      gap: 0.75rem;
      margin: 2rem 0 1.5rem;
    }
    .todo-form .input { flex: 1; }
    .todo-list { display: flex; flex-direction: column; gap: 0.75rem; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: var(--bg-glass);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: var(--transition);
    }
    .todo-item:hover { border-color: var(--border-active); }
    .todo-item input[type="checkbox"] {
      width: 18px; height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }
    .todo-item__title {
      flex: 1;
      font-size: 0.95rem;
      transition: var(--transition);
    }
    .todo-item--done .todo-item__title {
      text-decoration: line-through;
      color: var(--text-muted);
    }
    .todo-item__date {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      flex-shrink: 0;
    }
    .todo-item__del {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.2rem;
      border-radius: 4px;
      transition: var(--transition);
    }
    .todo-item__del:hover { color: var(--red); background: var(--red-dim); }
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .count-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
  </style>
</head>
<body>
  <header class="header">
    <a class="header__logo" href="/">NIYOJAK</a>
    <nav class="header__nav">
      <a href="/" class="active">To-Do</a>
      <a href="/admin">Admin</a>
    </nav>
  </header>

  <main class="container">
    <div class="hero">
      <h1 class="hero__title">To-Do App</h1>
      <p class="hero__sub">Running on NIYOJAK AI Scheduler — pods placed by machine learning</p>
    </div>

    <form class="todo-form" id="todo-form">
      <input
        class="input"
        id="todo-input"
        type="text"
        placeholder="Add a new task and press Enter"
        maxlength="200"
        autocomplete="off"
        required
      />
      <button class="btn btn--primary" type="submit">Add</button>
    </form>

    <div class="count-bar">
      <span id="count-label">Loading...</span>
      <button class="btn btn--ghost text-sm" id="clear-done-btn">Clear done</button>
    </div>

    <div class="todo-list" id="todo-list">
      <div class="empty">Loading tasks...</div>
    </div>
  </main>

  <script>
    const listEl   = document.getElementById('todo-list');
    const form     = document.getElementById('todo-form');
    const input    = document.getElementById('todo-input');
    const countLbl = document.getElementById('count-label');
    const clearBtn = document.getElementById('clear-done-btn');

    let todos = [];

    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      if (r.status === 204) return null;
      return r.json();
    }

    async function load() {
      todos = await api('GET', '/api/todos');
      render();
    }

    function render() {
      const total = todos.length;
      const done  = todos.filter(t => t.done).length;
      countLbl.textContent = `${total} task${total !== 1 ? 's' : ''} — ${done} done`;

      if (todos.length === 0) {
        listEl.innerHTML = '<div class="empty">No tasks yet. Add one above.</div>';
        return;
      }

      listEl.innerHTML = todos.map(t => `
        <div class="todo-item ${t.done ? 'todo-item--done' : ''}" data-id="${t.id}">
          <input type="checkbox" ${t.done ? 'checked' : ''} data-action="toggle" />
          <span class="todo-item__title">${escHtml(t.title)}</span>
          <span class="todo-item__date">${t.created_at.slice(0, 10)}</span>
          <button class="todo-item__del" data-action="delete" title="Delete">&times;</button>
        </div>
      `).join('');
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    listEl.addEventListener('click', async (e) => {
      const item = e.target.closest('[data-id]');
      if (!item) return;
      const id     = parseInt(item.dataset.id, 10);
      const action = e.target.dataset.action;
      const todo   = todos.find(t => t.id === id);

      if (action === 'toggle') {
        await api('PUT', `/api/todos/${id}`, { title: todo.title, done: !todo.done });
        load();
      } else if (action === 'delete') {
        await api('DELETE', `/api/todos/${id}`);
        load();
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      input.value = '';
      await api('POST', '/api/todos', { title });
      load();
    });

    clearBtn.addEventListener('click', async () => {
      const done = todos.filter(t => t.done);
      await Promise.all(done.map(t => api('DELETE', `/api/todos/${t.id}`)));
      load();
    });

    load();
  </script>
</body>
</html>
