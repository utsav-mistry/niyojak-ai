---
# Grafana Deployment.
# Pre-configured with Prometheus as a data source.
# Accessible at http://NODE1_IP:30091 — user: admin / password: niyojak
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: niyojak-system
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
        - name: grafana
          image: grafana/grafana:10.3.3
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "niyojak"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_SERVER_HTTP_PORT
              value: "3000"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: data
          emptyDir: {}

---
# Grafana provisioning — auto-wires Prometheus as a data source on startup.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: niyojak-system
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus.niyojak-system.svc.cluster.local:9090
        access: proxy
        isDefault: true

---
# Grafana Service — NodePort 30091 for browser access.
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: niyojak-system
  labels:
    app: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30091
  type: NodePort
