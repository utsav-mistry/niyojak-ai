---
# node-exporter DaemonSet.
# Deploys one node-exporter pod on every node in the cluster.
# Exposes hardware metrics (CPU, memory, disk, network) on port 9100.
# The AI feature_store.py queries these via Prometheus.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: niyojak-system
  labels:
    app: node-exporter
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostPID: true
      hostNetwork: true
      # Must run on every node including control-plane and stressed workers.
      tolerations:
        - operator: Exists
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.7.0
          args:
            - --path.rootfs=/host
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker)($|/)
          ports:
            - containerPort: 9100
              hostPort: 9100
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: root
              mountPath: /host
              readOnly: true
      volumes:
        - name: root
          hostPath:
            path: /

---
# Headless service so Prometheus can discover node-exporter pods.
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: niyojak-system
  labels:
    app: node-exporter
spec:
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
  clusterIP: None
