---
# Prometheus ConfigMap — scrape configuration.
# Scrapes node-exporter on every node every 15 seconds.
# Also scrapes the niyojak-aiservice /metrics endpoint for scheduler stats.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: niyojak-system
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      # Scrape node-exporter on every cluster node via the headless service.
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [niyojak-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

      # Scrape niyojak-aiservice for custom scheduler metrics.
      - job_name: niyojak-aiservice
        static_configs:
          - targets: ['niyojak-aiservice:8000']
        metrics_path: /metrics

      # Scrape Prometheus itself.
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

---
# Prometheus Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: niyojak-system
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.50.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=24h
            - --web.enable-lifecycle
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
# ServiceAccount for Prometheus (needs to discover endpoints via K8s API).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: niyojak-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: niyojak-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus

---
# Prometheus Service — accessible within the cluster at prometheus:9090.
# Also exposed as NodePort 30090 for direct browser access from the host.
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: niyojak-system
  labels:
    app: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30090
  type: NodePort
